name: Windows package

# Builds the frozen PyInstaller backend + Electron shell on Windows, smoke-tests
# the frozen backend executable without relying on the runner's Python, and
# uploads the unsigned NSIS installer and unpacked tree as artifacts.
# Signing is intentionally absent — see packaging/electron/README.md.

on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # current LTS
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-packaging.txt

      - name: Build frozen backend and Electron package
        shell: pwsh
        run: ./packaging/electron/build_windows.ps1

      - name: Smoke test frozen backend without runner Python on PATH
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, os.getcwd())
          from backend.process_harness import BackendProcessHarness

          exe = Path(".dist/pyinstaller/aqua-backend/aqua-backend.exe").resolve()
          assert exe.is_file(), f"missing frozen backend: {exe}"

          # Approximate a machine without Python: strip the interpreter from the
          # child environment so the frozen exe must run self-contained. The
          # already-running parent Python does not need PATH to keep working.
          os.environ.pop("PYTHONPATH", None)
          os.environ.pop("PYTHONHOME", None)
          os.environ.pop("VIRTUAL_ENV", None)
          os.environ["PATH"] = os.pathsep.join(
              entry
              for entry in os.environ.get("PATH", "").split(os.pathsep)
              if "python" not in entry.lower() and "hostedtoolcache" not in entry.lower()
          )

          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as tmp:
              harness = BackendProcessHarness(
                  Path(tmp) / "user-data", backend_executable=exe
              )
              try:
                  harness.start()
                  ready = harness.request("/api/ready", authenticated=False)
                  assert ready.status == 200 and ready.json().get("ok") is True, ready
                  assert harness.request("/api/settings", authenticated=False).status == 401
                  assert harness.request("/api/settings").status == 200
              finally:
                  harness.stop()
          print("frozen backend smoke passed")
          PY

      - name: Run packaging-contract tests
        run: >
          python -m pytest -q -p no:faker
          backend/tests/test_packaged_resources.py
          backend/tests/test_third_party_notices.py
          backend/tests/test_release_metadata.py
          backend/tests/test_process_harness.py
          backend/tests/test_packaged_smoke.py

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aqua-essence-windows-installer
          path: .dist/electron/*.exe
          if-no-files-found: error
          retention-days: 10

      - name: Upload unpacked application tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aqua-essence-win-unpacked
          path: .dist/electron/win-unpacked/
          if-no-files-found: error
          retention-days: 10

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aqua-essence-windows-installer
          path: release-assets

      - name: Validate release and generate notes/checksums
        run: >
          python scripts/prepare_release.py
          --tag "${GITHUB_REF_NAME}"
          --artifacts-dir release-assets
          --notes-output release-assets/RELEASE_NOTES.md
          --checksums-output release-assets/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/Aqua-Essence-Setup-*.exe \
            release-assets/SHA256SUMS \
            --verify-tag \
            --title "Aqua Essence ${GITHUB_REF_NAME}" \
            --notes-file release-assets/RELEASE_NOTES.md
